<header class="fever-header" [class.detail-view]="isDetailPage" [class.menu-open]="isMobileMenuOpen">

    <div class="header-center" [class.mobile-visible]="isMobileMenuOpen">
        @if (showFilters) {
        <app-recipe-filters></app-recipe-filters>
        }
    </div>

    <div class="header-right">
        <div class="language-switcher">
            <button class="lang-btn" [class.active]="currentLang === 'en'" (click)="switchLanguage('en')"
                title="English">
                🇺🇸
            </button>
            <button class="lang-btn" [class.active]="currentLang === 'es'" (click)="switchLanguage('es')"
                title="Español">
                🇪🇸
            </button>
        </div>

        @if (showFilters) {
        <button class="mobile-toggle" (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileMenuOpen">
            <span class="hamburger"></span>
        </button>
        }
    </div>

    @if (showCreateModal) {
    <app-recipe-create-modal (close)="closeCreateModal()" (recipeCreated)="onRecipeCreated()"></app-recipe-create-modal>
    }

    @if (isMobileMenuOpen) {
    <div class="mobile-backdrop" (click)="toggleMobileMenu()"></div>
    }
    <!-- Floating Add Button Overlay -->
    <app-floating-add-button (clicked)="openCreateModal()"></app-floating-add-button>
</header>
