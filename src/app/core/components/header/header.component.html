<header class="fever-header" [class.detail-view]="isDetailPage">
    <div class="header-left">
        <a routerLink="/" class="logo">Fever Pets</a>
    </div>

    <div class="header-center">
        @if (showFilters) {
        <app-pet-filters></app-pet-filters>
        }
    </div>

    <div class="header-right">
        <div class="language-switcher">
            <button class="lang-btn" [class.active]="currentLang === 'en'" (click)="switchLanguage('en')"
                title="English">
                🇺🇸
            </button>
            <button class="lang-btn" [class.active]="currentLang === 'es'" (click)="switchLanguage('es')"
                title="Español">
                🇪🇸
            </button>
        </div>
    </div>
</header>
