<div class="filters">
    <div class="search-container">
        <input type="text" [placeholder]="'searchPlaceholder' | translate" class="search-input"
            (input)="updateName($event)" [value]="filterService.filters().name">
    </div>
    <div class="divider"></div>
    <div class="flags-container">
        <button class="filter-btn" [class.active]="filterService.filters().kind === 'dog'" (click)="toggleKind('dog')">
            🐶
        </button>
        <button class="filter-btn" [class.active]="filterService.filters().kind === 'cat'" (click)="toggleKind('cat')">
            🐱
        </button>
    </div>
    <div class="divider"></div>
    <div class="dropdown">
        <select (change)="updateFilter('weight', $event)" [value]="filterService.filters().weight">
            <option value="all">{{ 'weightAll' | translate }}</option>
            <option value="small">{{ 'weightSmall' | translate }}</option>
            <option value="medium">{{ 'weightMedium' | translate }}</option>
            <option value="large">{{ 'weightLarge' | translate }}</option>
        </select>
    </div>
    <div class="dropdown">
        <select (change)="updateFilter('height', $event)" [value]="filterService.filters().height">
            <option value="all">{{ 'heightAll' | translate }}</option>
            <option value="short">{{ 'heightShort' | translate }}</option>
            <option value="average">{{ 'heightAverage' | translate }}</option>
            <option value="tall">{{ 'heightTall' | translate }}</option>
        </select>
    </div>
    <div class="dropdown">
        <select (change)="updateFilter('length', $event)" [value]="filterService.filters().length">
            <option value="all">{{ 'lengthAll' | translate }}</option>
            <option value="short">{{ 'lengthShort' | translate }}</option>
            <option value="average">{{ 'lengthAverage' | translate }}</option>
            <option value="long">{{ 'lengthLong' | translate }}</option>
        </select>
    </div>
    <div class="divider"></div>
    <div class="sort-container">
        <div class="dropdown sort-dropdown">
            <span class="sort-label">{{ 'sortByLabel' | translate }}</span>
            <select (change)="updateFilter('sortBy', $event)" [value]="filterService.sort().sortBy">
                <option value="name">{{ 'sortByName' | translate }}</option>
                <option value="weight">{{ 'sortByWeight' | translate }}</option>
                <option value="height">{{ 'sortByHeight' | translate }}</option>
                <option value="length">{{ 'sortByLength' | translate }}</option>
                <option value="kind">{{ 'sortByKind' | translate }}</option>
            </select>
        </div>
        <button class="order-toggle" (click)="toggleOrder()"
            [title]="filterService.sort().sortOrder === 'asc' ? 'Ascending' : 'Descending'">
            <span class="arrow" [class.desc]="filterService.sort().sortOrder === 'desc'">↑</span>
        </button>
    </div>
</div>
