@if (pet) {
<div class="pet-detail-container">
    <div class="header">
        <a routerLink="/" class="back-link">
            <span class="back-arrow">←</span>
        </a>
        <h1>{{ pet.name | uppercase }}</h1>
    </div>

    <div class="content-grid">
        <aside class="sidebar">
            <div class="info-item">
                <div class="icon">⚖️</div>
                <div class="label">WEIGHT</div>
                <div class="value">{{ pet.weight | gramsToKg }} kg</div>
            </div>

            <div class="separator"></div>

            <div class="info-item">
                <div class="icon">📏</div>
                <div class="label">HEIGHT</div>
                <div class="value">{{ pet.height }} cm</div>
            </div>

            <div class="separator"></div>

            <div class="info-item">
                <div class="icon">↔️</div>
                <div class="label">LENGTH</div>
                <div class="value">{{ pet.length }} cm</div>
            </div>

            <div class="separator"></div>

            <div class="info-item">
                <div class="icon">🐾</div>
                <div class="label">KIND</div>
                <div class="value">{{ pet.kind | titlecase }}</div>
            </div>
        </aside>

        <main class="main-image">
            <div class="image-wrapper">
                <img [src]="pet.photo_url || defaultPetImage" [alt]="pet.name" (error)="onImageError($event)"
                    onerror="this.onerror=null; this.src='/assets/default.png';">
            </div>
            <p class="quote">{{ pet.description }}</p>
        </main>
    </div>
</div>
} @else {
<div class="loading">
    <img src="assets/loading.png" alt="Loading..." class="loading-img">
</div>
}
