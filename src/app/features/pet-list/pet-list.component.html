<div class="pet-list-container">
    <div class="hero-section">
        <div class="hero-content">
            <h1>Jade</h1>
            <p>Say hello to the pet of the day</p>
        </div>
    </div>

    <div class="container">

        @if (isLoading) {
        <div class="loading">
            <img src="assets/loading.png" alt="Loading..." class="loading-img">
        </div>
        } @else if (pets.length > 0) {
        <div class="pet-grid">
            @for (pet of pets; track pet.id) {
            <div class="pet-card" (click)="goToDetail(pet.id)">
                <div class="card-image">
                    <img [src]="pet.photo_url || defaultPetImage" [alt]="pet.name" (error)="onImageError($event)"
                        onerror="this.onerror=null; this.src='/assets/default.png';">
                </div>
                <div class="card-content">
                    <h3>{{ pet.name }}</h3>
                    <div class="card-info">
                        <p><span class="icon">🐾</span> {{ pet.kind | titlecase }}</p>
                        <p><span class="icon">⚖️</span> {{ pet.weight | gramsToKg }} kg</p>
                        <p><span class="icon">📏</span> {{ pet.height }} cm</p>
                        <p><span class="icon">↔️</span> {{ pet.length }} cm</p>
                    </div>
                </div>
            </div>
            }
        </div>
        } @else {
        <div class="no-results">
            <img src="assets/nof-found.png" alt="No pets found">
        </div>
        }
    </div>
</div>
